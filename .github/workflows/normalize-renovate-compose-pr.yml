name: Normalize Renovate Compose PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  normalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      github.event.pull_request.user.login == 'yin2hao'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          token: ${{ secrets.GITHUBTOKEN }}
          persist-credentials: true

      - name: Restore immutable Compose source before tests
        run: node .github/scripts/github/normalize-renovate-compose-pr.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
