name: LLM Code Review

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  workflow_run:
    workflows: [ "Update app version in Renovate Branches" ]
    types: [ completed ]

jobs:
  llm-code-review:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Run trusted workflow code from the base/default branch; the script reads the PR diff through GitHub API.
          ref: ${{ github.event.repository.default_branch }}

      - name: LLM code review with model fallback
        run: node .github/scripts/llm-code-review-fallback.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.LLM_CODE_REVIEW_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.LLM_API_KEY }}
          LANGUAGE: Chinese
          OPENAI_API_ENDPOINT: ${{ secrets.LLM_BASE_URL }}
          MODEL: openai/gpt-oss-120b
          # Add more fallback models here, or set LLM_MODELS to override the full order.
          FALLBACK_MODELS: z-ai/glm5.1,qwen/qwen3.5-397b-a17b
          REVIEW_POLICY: relaxed
          PROMPT: "请把以下 PR 作为一个整体进行审查。只有当 PR 引入超高危漏洞或明确的逻辑性错误时才阻止自动合并；普通风险、优化建议、缺少测试或不确定性请作为备注说明，但仍允许合并。"
          top_p: 1
          temperature: 0
          # max_tokens: 10000
          MAX_DIFF_LENGTH: 10000
          IGNORE_PATTERNS: "/node_modules,*.md,/dist,/.github"
          FILE_PATTERNS: "*.java,*.go,*.py,*.vue,*.ts,*.js,*.css,*.scss,*.html,*.yml,*.yaml"

      - name: Upload PR metadata
        uses: actions/upload-artifact@v6
        with:
          name: llm-review-pr-metadata
          path: .github/llm-review-pr-metadata.json
          if-no-files-found: ignore
