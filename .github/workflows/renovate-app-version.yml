name: Update app version in Renovate Branches

on:
  push:
    branches: [ 'renovate/*' ]

permissions:
  contents: write

jobs:
  update-app-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Configure repo
        run: |
          git config --local user.email "githubaction@githubaction.com"
          git config --local user.name "github-action update-app-version"

      - name: Get list of updated files by the last commit in this branch separated by space
        id: updated-files
        run: |
          echo "::set-output name=files::$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | tr '\n' ' ')"

      - name: Run renovate-app-version.sh on updated files
        run: |
          IFS=' ' read -ra files <<< "${{ steps.updated-files.outputs.files }}"

          mapfile -t docker_compose_files < <(
            printf '%s\n' "${files[@]}" |
              awk -F/ '$1 == "apps" && $NF == "docker-compose.yml" { print }' |
              sort -t/ -k2,2 -k3,3Vr
          )

          for file in "${docker_compose_files[@]}"; do
            if [[ $file == *"docker-compose.yml"* ]]; then
              app_name=$(echo $file | cut -d'/' -f 2)
              old_version=$(echo $file | cut -d'/' -f 3)
              bash .github/scripts/renovate-app-version.sh "$app_name" "$old_version"
            fi
          done

      - name: Commit & Push Changes
        run: |
          IFS=' ' read -ra files <<< "${{ steps.updated-files.outputs.files }}"

          mapfile -t app_names < <(
            printf '%s\n' "${files[@]}" |
              awk -F/ '$1 == "apps" && $NF == "docker-compose.yml" { print $2 }' |
              sort -u
          )

          if [[ ${#app_names[@]} -eq 0 ]]; then
            echo "No app docker-compose.yml changes to commit."
            exit 0
          fi

          for app_name in "${app_names[@]}"; do
            git add "apps/$app_name"
          done

          if git diff --cached --quiet; then
            echo "No app version changes to commit."
            exit 0
          fi

          git commit -m "Update app version [skip ci]" --no-verify
          git push
