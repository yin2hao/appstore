services:
  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:1.18.0
    container_name: "${CONTAINER_NAME}"
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8000"
    environment:
      NODE_ENV: production
      FORCE_COLOR: 1
      SILLYTAVERN_HEARTBEATINTERVAL: 30
      PUID: "${PUID}"
      PGID: "${PGID}"
    volumes:
      - ./config:/home/node/app/config
      - ./data:/home/node/app/data
      - ./plugins:/home/node/app/plugins
      - ./extensions:/home/node/app/public/scripts/extensions/third-party
    healthcheck:
      test:
        - CMD
        - node
        - src/healthcheck.js
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
