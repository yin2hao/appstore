services:
  loki:
    image: grafana/loki:3.7.9
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${HOST_IP}:${PANEL_APP_PORT_HTTP}:3100"
    volumes:
      - ./data:/loki
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
